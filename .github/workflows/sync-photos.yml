# Every 8 hours, pull new photos from the trip's iCloud shared album into the site.
# Run it by hand from the Actions tab: "Sync photos from iCloud" > Run workflow.
name: Sync photos from iCloud

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Pull photos from the shared album
        env:
          # The album link lives in a secret so it isn't public in the repo.
          ICLOUD_ALBUM_URL: ${{ secrets.ICLOUD_ALBUM_URL }}
          # Who may publish (iCloud user IDs, comma-separated). Empty means only the album owner.
          PHOTO_UPLOADERS: ${{ vars.PHOTO_UPLOADERS }}
        run: uv run scripts/sync_photos.py

      - name: Save any changes
        id: save
        run: |
          git add -A assets/photos _data/photos.json
          if git diff --cached --quiet; then
            echo "No new photos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync photos from iCloud"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Republish the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
