# One entry per day. mode is land, sea, or air.
# coords is [lat, lng] for the map dot. Air days use route instead: a list of stops.
# Sea days show the ship photo in the background instead of the map.
# tz is the time zone the schedule times are in. A schedule item can override it
# with its own tz (and date, if it lands on a different calendar day).
# celebrate (plus optional celebrate_note) throws a party on that day.
# Times are local to wherever we are.

